<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="blhd-stem" x1="80" y1="80" x2="200" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="blhd-loop" x1="160" y1="60" x2="420" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
    <filter id="blhd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left: Standalone Logo Icon Mark (Dark Mode) -->
  <g transform="translate(16, 14) scale(0.22)" filter="url(#blhd-shadow)">
    <!-- Monogram P Vertical Stem -->
    <rect x="96" y="64" width="88" height="384" rx="44" fill="url(#blhd-stem)" />

    <!-- Monogram P Forward Loop / Food Bag Shape -->
    <path d="M140 64H276C353.32 64 416 126.68 416 204C416 281.32 353.32 344 276 344H140V260H276C306.928 260 332 234.928 332 204C332 173.072 306.928 148 276 148H140V64Z" 
          fill="url(#blhd-loop)" />

    <!-- Pure White Inner Cutout -->
    <path d="M220 148H276C306.928 148 332 173.072 332 204C332 234.928 306.928 260 276 260H220V148Z" 
          fill="#FFFFFF" />

    <!-- Bag Handle Arc on top of P -->
    <path d="M236 148V104C236 90.7452 246.745 80 260 80C273.255 80 284 90.7452 284 104V148" 
          stroke="#16A34A" stroke-width="16" stroke-linecap="round" />

    <!-- Fast Pickup Checkmark Accent (Warm Gold) -->
    <circle cx="276" cy="204" r="18" fill="#FFBF4A" />
  </g>

  <!-- Right: Full Typography "PickupOrder" (Dark Mode) -->
  <g transform="translate(132, 0)">
    <text x="0" y="80" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Pickup</tspan><tspan fill="#4ADE80">Order</tspan>
    </text>
  </g>
</svg>
